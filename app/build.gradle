plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id("com.google.devtools.ksp")
}

// Load keystore properties
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath != null) {
                    storeFile rootProject.file(storeFilePath)
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            }
        }
    }

    defaultConfig {
        applicationId "com.brewaco3.muzei.wallhaven"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode getProperty('app.version.code') as int
        versionName getProperty('app.version.name')

        manifestPlaceholders = [
                PACKAGE: "com.brewaco3.muzei.wallhaven"
        ]

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "room.incremental"   : "true",
                ]
            }
        }
    }

    buildTypes {
        release {
            // Without a keystore the release build still assembles, it just comes out unsigned.
            // CI writes keystore.properties before building, so its APK is signed as usual.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // No debug build type is declared: minifying a debuggable build only disables every
        // optimisation R8 would otherwise apply, so it costs build time and buys nothing
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    lint {
        // Glide ships a NotificationTarget that this app never touches, and the app posts no
        // notifications at all, so the check can only report on unreachable library code
        disable 'NotificationPermission'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    flavorDimensions 'deliver'

    productFlavors {
        dev {
            dimension = 'deliver'
            applicationIdSuffix '.dev'
            versionNameSuffix ':dev'

            manifestPlaceholders = [
                    PACKAGE: "com.brewaco3.muzei.wallhaven.dev"
            ]
        }
        prod {
            dimension = 'deliver'
        }
    }
    namespace 'com.brewaco3.muzei.wallhaven'
}

dependencies {
    implementation "androidx.annotation:annotation:${libs.androidx.annotation}"
    implementation "androidx.appcompat:appcompat:${libs.androidx.appcompat}"
    implementation "androidx.constraintlayout:constraintlayout:${libs.androidx.constraintlayout}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${libs.androidx.coordinatorlayout}"
    implementation "androidx.preference:preference-ktx:${libs.androidx.preference}"
    implementation "androidx.recyclerview:recyclerview:${libs.androidx.recyclerview}"
    implementation "androidx.room:room-runtime:${libs.libRoom}"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.work:work-runtime:${libs.androidx.work}"
    implementation "androidx.work:work-runtime-ktx:${libs.androidx.work}"
    implementation "com.github.bumptech.glide:glide:${libs.libGlide}"
    implementation "com.google.android.material:material:${libs.androidx.material}"
    implementation "com.google.android.apps.muzei:muzei-api:${libs.libMuzei}"
    implementation "com.squareup.moshi:moshi:${libs.libMoshi}"
    implementation "com.squareup.okhttp3:okhttp:${libs.libOkhttp}"
    implementation "com.squareup.retrofit2:converter-moshi:${libs.libRetrofit}"
    implementation "com.squareup.retrofit2:retrofit:${libs.libRetrofit}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.kotlin.coroutines}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:${libs.kotlin.coroutines}"

    ksp "androidx.room:room-compiler:${libs.libRoom}"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:${libs.libMoshi}"

    testImplementation "junit:junit:4.13.2"
}

allprojects {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}
